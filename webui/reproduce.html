<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>复现指南 · 湖北省空气质量预测系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Merriweather:wght@400;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <header class="hero">
        <div class="hero__content">
            <p class="eyebrow">Monet's Garden · Reproduce Guide</p>
            <h1>项目复现与快速体验指南</h1>
            <p>
                本页面说明如何使用 Docker / VPS / 本地 Python 环境快速复现湖北省空气质量预测系统。
            </p>
            <div class="hero__chips">
                <span>Docker 镜像：das1jason/air-quality-forecast:latest</span>
                <span>支持：本地 / VPS / Cloudflare Tunnel</span>
            </div>
            <div class="action-group" style="margin-top: 1rem;">
                <a href="/" class="button ghost">返回工作台</a>
            </div>
        </div>
    </header>

    <main class="layout--single">
        <section class="panel">
            <h2>复现步骤</h2>
            <div id="md-root" class="markdown-body">
                <p class="muted">正在加载复现文档...</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>2025 湖北省空气质量预测实验 · 复现指南</p>
    </footer>

    <!-- 使用 CDN 版本的 marked.js 进行 Markdown 渲染 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        async function loadReproduceGuide() {
            const root = document.getElementById("md-root");
            try {
                const res = await fetch("/docs/reproduce_guide.md");
                if (!res.ok) {
                    root.innerHTML = "<p class='error'>无法加载复现文档（HTTP " + res.status + ")</p>";
                    return;
                }
                const text = await res.text();
                root.innerHTML = marked.parse(text);
            } catch (err) {
                root.innerHTML = "<p class='error'>加载复现文档时出错：" + err + "</p>";
            }
        }

        loadReproduceGuide();
    </script>

</body>

</html>
